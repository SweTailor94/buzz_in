[package]
name = "button-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m-rt = { version = "0.7.5" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = "0.1.1"
embassy-net = { version = "0.9.0", features = ["tcp", "proto-ipv4", "medium-ethernet", "defmt", "dhcpv4"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "critical-section-impl", "time-driver", "defmt"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-sync = { version= "0.8.0", features=["defmt"] }
embassy-time = { version= "0.5.0", features= ["defmt", "defmt-timestamp-uptime",]}

static_cell = { version = "2.1.1" }
defmt = "1.0.1"
defmt-rtt = "1.1.0"
heapless = "0.9.1"
portable-atomic = { version = "1.13.1", features = ["critical-section"] }


panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
smart-leds = "0.4.0"

messages = {path="../messages"}
assign-resources = "0.5.0"


